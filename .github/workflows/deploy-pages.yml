name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/deploy-pages.yml', 'images/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore logo assets
        run: |
          mkdir -p docs
          cp images/logo.png docs/logo.png 2>/dev/null || true
          cp images/qr-code.jpg docs/qr-code.jpg 2>/dev/null || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
